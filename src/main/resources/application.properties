spring.application.name=buildlink
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/buildlink?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

# ? Logging
logging.level.com.buildlink=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level [%logger{36}] - %msg%n

# ? Messages d'erreur Hibernate plus lisibles
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# ? Encodage des messages d'erreur
server.error.include-message=always
server.error.include-binding-errors=always
